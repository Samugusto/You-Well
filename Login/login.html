<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="loader">
    <img src="img/Sem título2.png" alt="Loading" class="spinner-img">
</div>

    <img src="img/Sem título.png" alt="logo youwell" class="logo">
    <div class="bloco">
        <h1 class="title">Bem-Vindo(a) ;)</h1>
        <div class="footerdiv"></div>

        <div class="input-floating">
            <input id="nome" type="text" required><i class="bi bi-exclamation-circle" id="icone3"></i><i
                class="bi bi-check-circle" id="icone4"></i>
            <label for="nome">Nome Completo</label>
        </div>

        <div class="input-floating-senha">
            <input id=senha type="password" required id="password"><i class="bi bi-eye-fill icone" id="botaoSenha"></i>
            <label for="senha">Senha</label>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div><!--barra de progresso de senha-->
        </div>

        <div class="input-floating">
            <input id="confirmar" type="password" required><i class="bi bi-exclamation-circle" id="icone5"></i><i
                class="bi bi-check-circle" id="icone6"></i>
            <label for="confirmar">Confirmar Senha</label>
        </div>

        <div class="input-floating">
            <input id="setor" type="number" required><i class="bi bi-exclamation-circle" id="icone7"></i><i
                class="bi bi-check-circle" id="icone8"></i>
            <label for="setor">Setor</label>
        </div>

        <h1 class="botao" id="cadastrar">Entrar</h1>
        <a href="https://br.pinterest.com/pin/1124844444459832793/">
        <h1 class="outro">já tem um cadastro? clique aqui!</h1></a>
    </div>
    <script src="script.js"></script>
</body>

</html>
